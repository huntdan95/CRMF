# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# Public values (the Firebase web SDK config, the admin allowlist email) are
# inlined here — they ship to the browser anyway, so there's no benefit to
# routing them through Secret Manager.
#
# Truly-secret values are added as `secret:` references and managed with
# `firebase apphosting:secrets:set NAME` + `firebase apphosting:secrets:grantaccess`.
# The list at the bottom of this file shows what's still pending.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ---------------------------------------------------------------------------
  # Firebase web SDK config — public values, shipped to the browser.
  # ---------------------------------------------------------------------------
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCOqwkw5egdNHw6W3k1oXK8GsqHg3SzphI
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: crmf-99aad.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: crmf-99aad
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: crmf-99aad.firebasestorage.app
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "694605572640"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:694605572640:web:5967117d5eaa08a3c3ea45"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-5GZX07YZTV
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_ADMIN_EMAIL
    value: travisurbin1@gmail.com
    availability: [BUILD, RUNTIME]

  # Public half of the VAPID key pair for crew push notifications. MUST
  # match VAPID_PUBLIC_KEY in functions/src/lib/crew-push.ts; the private
  # half is the VAPID_PRIVATE_KEY Cloud Functions secret.
  - variable: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    value: BPQqtw9H_ODEjpQ4zaQnJV5kWOLf8ALuP8Zf_sJZx8kmBcuu3uHHVsCxmTVD6zhBwBt7m4tD4D5Yl0gSnCzkY3M
    availability: [BUILD, RUNTIME]

  # ---------------------------------------------------------------------------
  # Server-side. FIREBASE_ADMIN_PROJECT_ID is the only piece needed when
  # using App Hosting's automatic Application Default Credentials — the
  # CLIENT_EMAIL + PRIVATE_KEY pair becomes optional (admin.ts falls through
  # to ADC when they're missing).
  # ---------------------------------------------------------------------------
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: crmf-99aad
    availability: [RUNTIME]

  - variable: NEXT_PUBLIC_FUNCTIONS_BASE_URL
    value: https://us-central1-crmf-99aad.cloudfunctions.net
    availability: [BUILD, RUNTIME]

  # When "true", src/proxy.ts 301s www.crystalrivermanateefun.com and the
  # *.hosted.app URL to https://crystalrivermanateefun.com (path + query
  # kept; /api/* and /admin/* stay put). Flip to "true" only after the
  # custom domain's SSL certificate is active — see the README launch
  # checklist. Takes effect on the next rollout.
  - variable: CANONICAL_HOST_REDIRECT
    value: "false"
    availability: [RUNTIME]

# ---------------------------------------------------------------------------
# Pending — uncomment + populate each block once you've set up the underlying
# vendor. Cloud Function *secrets* are set with `firebase functions:secrets:set`
# (already populated with placeholders; replace via the same command).
# App Hosting build/runtime env vars use `firebase apphosting:secrets:set`.
# ---------------------------------------------------------------------------
#
#  Crew trip-photo uploads to Google Drive. Run `npm run connect:drive` and
#  set the two secrets it prints first; an App Hosting rollout fails if a
#  referenced secret doesn't exist. Until then the crew app says uploads
#  aren't connected yet.
#  - variable: GOOGLE_DRIVE_CLIENT_ID
#    value: <client-id>.apps.googleusercontent.com
#    availability: [RUNTIME]
#  - variable: GOOGLE_DRIVE_CLIENT_SECRET
#    secret: GOOGLE_DRIVE_CLIENT_SECRET
#    availability: [RUNTIME]
#  - variable: GOOGLE_DRIVE_REFRESH_TOKEN
#    secret: GOOGLE_DRIVE_REFRESH_TOKEN
#    availability: [RUNTIME]
#
#  MCP endpoint (/api/mcp). Create the MCP_TOKEN secret and grant this
#  backend access first (README → MCP server); an App Hosting rollout fails
#  if a referenced secret doesn't exist. Until then /api/mcp answers 503.
#  - variable: MCP_TOKEN
#    secret: MCP_TOKEN
#    availability: [RUNTIME]
#
#  - variable: STRIPE_PUBLISHABLE_KEY
#    value: pk_live_...
#    availability: [BUILD, RUNTIME]
