# Deploys Cloud Functions (and, if picked, the Firestore and Storage rules)
# from main. Manual only: Actions → Deploy → Run workflow. The site itself
# deploys through App Hosting on every push to main.
#
# Needs the FIREBASE_SERVICE_ACCOUNT repository secret: a JSON key for a
# service account on crmf-99aad (README → Deploying from GitHub).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      only:
        description: What to deploy
        type: choice
        default: functions
        options:
          - functions
          - functions,firestore:rules,storage
          - firestore:rules,storage

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: firebase deploy --only ${{ inputs.only }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Test functions
        working-directory: functions
        run: npm test

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # --force deletes functions that are no longer in the code; CI can't
      # answer the CLI's "delete these?" prompt.
      - name: Deploy
        run: npx --yes firebase-tools@14 deploy --only "${{ inputs.only }}" --project crmf-99aad --non-interactive --force
